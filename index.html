<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu bản thân - Võ Hoàng Gia Bảo (PK04985)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 6px;
        }
        .student-id {
            display: inline-block;
            background: #ebf4ff;
            color: #3182ce;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        .job-title {
            font-size: 15px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .bio {
            font-size: 14px;
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        .skill-tag {
            background: #edf2f7;
            color: #2d3748;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .btn-contact {
            display: inline-block;
            background: #667eea;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn-contact:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Thay link ảnh đại diện của bạn vào thuộc tính src -->
        <img src="https://via.placeholder.com/150" alt="Ảnh đại diện của Võ Hoàng Gia Bảo" class="avatar">
        
        <h1>Võ Hoàng Gia Bảo</h1>
        <div class="student-id">MSSV: PK04985</div>
        <div class="job-title">Sinh viên / Lập trình viên tương lai</div>
        
        <p class="bio">
            Xin chào! Mình là Võ Hoàng Gia Bảo (PK04985), yêu thích lập trình, công nghệ và luôn cố gắng rèn luyện mỗi ngày để tạo ra các sản phẩm thực tế.
        </p>

        <div class="skills">
            <span class="skill-tag">HTML & CSS</span>
            <span class="skill-tag">JavaScript</span>
            <span class="skill-tag">Python</span>
            <span class="skill-tag">Học tập & Sáng tạo</span>
        </div>

        <a href="mailto:giabao@example.com" class="btn-contact">Liên hệ với mình</a>
    </div>

</body>
</html>
